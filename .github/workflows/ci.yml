name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      # Lint debt once reached 1033 violations because no gate existed.
      # All checks must stay green; fix new violations in the PR that
      # introduces them.
      - name: Install dependencies
        # The runtime lock constrains overlapping packages so CI tests
        # against the same versions Docker ships.
        run: pip install -e ".[dev]" -c requirements-lock.txt

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      # Type-check debt once stood at ~550 strict errors; the stock was
      # cleared to zero over five batches. This gate keeps it there.
      - name: Mypy strict check
        run: mypy app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      # GitHub-hosted runners reach PyPI directly (no regional mirror needed).
      - name: Install dependencies
        # The runtime lock constrains overlapping packages so CI tests
        # against the same versions Docker ships.
        run: pip install -e ".[dev]" -c requirements-lock.txt

      # The test suite is hermetic (SQLite in-memory, fakes for Redis and
      # external services); the coverage gate (fail_under=70) is enforced
      # by pyproject addopts.
      - name: Run tests with coverage gate
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  prometheus-rules:
    runs-on: ubuntu-latest
    env:
      # Match the deployed engine so newer PromQL cannot hide incompatibility.
      PROMETHEUS_TEST_IMAGE: prom/prometheus:v2.47.2
    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm
          --volume "$PWD/deploy/prometheus:/rules:ro"
          --entrypoint /bin/promtool
          "$PROMETHEUS_TEST_IMAGE"
          check rules /rules/alerts.yml

      - name: Exercise alert timing and missing-data scenarios
        run: >-
          docker run --rm
          --volume "$PWD/deploy/prometheus:/rules:ro"
          --entrypoint /bin/promtool
          "$PROMETHEUS_TEST_IMAGE"
          test rules /rules/containment-alerts.test.yml

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ci_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d ci_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_MIGRATION_DATABASE_URL: postgresql+asyncpg://ci_test:ci_test_password@localhost:5432/ci_migrations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install dependencies
        run: pip install -e ".[dev]" -c requirements-lock.txt

      # Both supported databases must round-trip the complete migration chain.
      # command.check compares the live schema to all models registered by env.py;
      # it fails on drift without generating or inspecting a revision file.
      - name: Verify SQLite and PostgreSQL migration chains and model alignment
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from alembic import command
          from alembic.config import Config
          from app.config.settings import settings

          with TemporaryDirectory(prefix="rag-ci-migrations-") as scratch:
              databases = {
                  "SQLite": f"sqlite:///{Path(scratch) / 'migrations.db'}",
                  "PostgreSQL 16": os.environ["CI_MIGRATION_DATABASE_URL"],
              }
              for label, url in databases.items():
                  print(f"Verifying {label}", flush=True)
                  # Override in memory: Settings validates application URLs as
                  # async PostgreSQL, while Alembic also exercises sync SQLite.
                  settings.DATABASE_URL = url
                  config = Config("alembic.ini")
                  command.upgrade(config, "head")
                  command.downgrade(config, "base")
                  command.upgrade(config, "head")
                  command.check(config)
          EOF

      # Keep concurrency fixtures separate from the migrated schema, and scope
      # the opt-in PostgreSQL URL to this step rather than the default test suite.
      - name: Verify handoff concurrency on PostgreSQL
        env:
          RAG_TEST_DATABASE_URL: postgresql+asyncpg://ci_test:ci_test_password@localhost:5432/ci_handoff_concurrency
        run: |
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine

          url = os.environ["CI_MIGRATION_DATABASE_URL"].replace(
              "postgresql+asyncpg://", "postgresql+pg8000://", 1
          )
          engine = create_engine(url, isolation_level="AUTOCOMMIT")
          try:
              with engine.connect() as connection:
                  connection.exec_driver_sql("CREATE DATABASE ci_handoff_concurrency")
          finally:
              engine.dispose()
          EOF
          pytest --no-cov -q \
            app/tests/unit/repositories/test_ticket_concurrency.py \
            app/tests/unit/services/handoff/test_creation_concurrency.py

      # Exercise the operator scripts against a separate disposable Compose
      # project, including a real dump, new-database restore and failure rollback.
      - name: Verify PostgreSQL backup and recovery
        env:
          RAG_RUN_RESTORE_DRILL: "1"
        run: pytest --no-cov -q app/tests/integration/test_backup_restore_drill.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pip-audit (PyPA) checks every pin in the runtime lock against
      # the OSV/PyPI advisory databases. GitHub-hosted runners reach
      # the advisory APIs directly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependency lock
        run: pip-audit -r requirements-lock.txt --progress-spinner=off
