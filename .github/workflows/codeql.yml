name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep after the weekend's pushes (UTC).
    - cron: "30 4 * * 1"

# analyze uploads SARIF to the Security tab; nothing else is touched.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python

      # Python is interpreted: no autobuild step is needed — init extracts
      # the database straight from source, analyze uploads the SARIF.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:python"
