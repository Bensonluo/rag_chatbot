# Dependabot keeps pins fresh and surfaces CVEs early. Updates arrive as
# individual PRs; the CI gates (ruff, strict mypy, full pytest with the
# coverage floor, migration round-trips, pip-audit) are the merge bar —
# a Dependabot PR is only merged when all of them stay green.
version: 2
updates:
  # Runtime + dev Python dependencies (pyproject with pip extras).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Group minor/patch bumps so one PR updates the batch; majors stay
    # separate because they need real migration review.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - dependencies
  # GitHub Actions versions (checkout, setup-python, upload-artifact, ...).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci-deps)"
    labels:
      - dependencies
