# Kubernetes Deployment for RAG Chatbot API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-chatbot-api
  namespace: rag-chatbot
  labels:
    app: rag-chatbot
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rag-chatbot
      component: api
  template:
    metadata:
      labels:
        app: rag-chatbot
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: rag-chatbot
      containers:
      - name: api
        image: rag-chatbot:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: redis-url
        - name: QDRANT_URL
          value: "http://qdrant-service:6333"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: openai-api-key
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rag-chatbot-secrets
              key: secret-key
        - name: LOG_LEVEL
          value: "INFO"
        - name: CORS_ORIGINS
          value: "https://chat.example.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: rag-chatbot-service
  namespace: rag-chatbot
  labels:
    app: rag-chatbot
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: rag-chatbot
    component: api
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-chatbot-hpa
  namespace: rag-chatbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-chatbot-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rag-chatbot-pdb
  namespace: rag-chatbot
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rag-chatbot
      component: api
---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-chatbot
  namespace: rag-chatbot
---
# ConfigMap for application config
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-chatbot-config
  namespace: rag-chatbot
data:
  MEMORY_TYPE: "hybrid"
  INTENT_TYPE: "hybrid"
  WINDOW_SIZE: "10"
  SUMMARY_THRESHOLD: "20"
  VECTOR_WEIGHT: "0.7"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
