global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS service discovery, not a static target: Docker's embedded DNS
  # round-robins a plain service-name lookup to ONE container, so a
  # static target scrapes a random replica per interval under
  # --scale (counters interleave into garbage). type: A asks for ALL
  # container IPs behind the service name; refresh_interval picks up
  # scaled-up/down replicas. SRV is not served by the embedded DNS.
  - job_name: rag-chatbot-api
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 8000
        refresh_interval: 30s
