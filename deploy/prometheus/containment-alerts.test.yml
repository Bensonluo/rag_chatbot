# Native Prometheus 2.47.2 rule tests; run from any working directory:
#   promtool test rules deploy/prometheus/containment-alerts.test.yml
# These series are deterministic snapshots, not live DB/scrape/model evidence.
# Expected states/labels are independent of production expressions. The shared
# expected-alert anchors only avoid repeating annotation text.
# Time starts at Unix epoch zero. Default fresh series first become valid at
# minute 1; clock-offset cases explicitly test positive timestamps at minute 0.
# The first eight cases preserve the independently reproduced before scenarios.
rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: startup-never-refreshed
  interval: 1m
  input_series:
  - series: chat_containment_rate{job="rag-chatbot-api",instance="a"}
    values: 0+0x90
  - series: chat_sessions_served{job="rag-chatbot-api",instance="a"}
    values: 0+0x90
  - series: chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api",instance="a"}
    values: 0+0x90
  - series: up{job="rag-chatbot-api",instance="a"}
    values: 1+0x90
  alert_rule_test:
  - eval_time: 9m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 9m
    alertname: ContainmentStatsUnavailable
    exp_alerts: []
  - eval_time: 9m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
  - eval_time: 10m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 10m
    alertname: ContainmentStatsUnavailable
    exp_alerts:
    - &id001
      exp_labels: &id002
        job: rag-chatbot-api
        severity: warning
      exp_annotations:
        summary: 会话质量统计不可用或部分副本陈旧
        description: At least one discovered API target has no valid containment snapshot,
          or no API targets are discovered, for 10 minutes. Check scrape health, successful-refresh
          timestamps, database access, refresher startup/configuration and clock alignment.
          Zero served sessions with a fresh successful snapshot is valid. A disabled refresher
          also leaves this KPI unavailable; this alert does not by itself prove a customer-facing
          outage or low containment. A healthy replica does not hide another replica's unavailable
          evidence.
        runbook_url: https://github.com/Bensonluo/rag_chatbot/blob/main/docs/operations/containment-alerts.md
  - eval_time: 10m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentStatsUnavailable
    exp_alerts:
    - *id001
  - eval_time: 60m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
- name: fresh-empty-window-retains-low-rate
  interval: 1m
  input_series:
  - series: chat_containment_rate{job="rag-chatbot-api",instance="a"}
    values: 0.5+0x90
  - series: chat_sessions_served{job="rag-chatbot-api",instance="a"}
    values: 0+0x90
  - series: chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api",instance="a"}
    values: 0+60x90
  - series: up{job="rag-chatbot-api",instance="a"}
    values: 1+0x90
  alert_rule_test:
  - eval_time: 60m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentStatsUnavailable
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
