- name: fresh-low-positive-traffic-control
  interval: 1m
  input_series:
  - series: chat_containment_rate{job="rag-chatbot-api",instance="a"}
    values: 0.5+0x90
  - series: chat_sessions_served{job="rag-chatbot-api",instance="a"}
    values: 10+0x90
  - series: chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api",instance="a"}
    values: 0+60x90
  - series: up{job="rag-chatbot-api",instance="a"}
    values: 1+0x90
  alert_rule_test:
  - eval_time: 30m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 30m
    alertname: ContainmentStatsUnavailable
    exp_alerts: []
  - eval_time: 30m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
  - eval_time: 31m
    alertname: ContainmentRateLow
    exp_alerts:
    - &id003
      exp_labels: *id002
      exp_annotations:
        summary: 会话级自动处理代理率低于 70%
        description: Fresh nonempty snapshots report containment 50% for 30 minutes. This
          is the share of served sessions without a handoff ticket AND without an in-window
          downvote, not confirmed problem resolution. Only successfully scraped replicas with
          a successful refresh no more than 15 minutes old contribute to the mean. Empty,
          uninitialized, stale or invalid snapshots are excluded. A future-clock tolerance
          of 60 seconds avoids resetting pending alerts on small clock offsets; larger offsets
          are reported by ContainmentStatsClockSkew; ContainmentStatsUnavailable reports missing
          statistical evidence. Replicas can refresh at different instants; this is not an
          atomic database snapshot. Inspect ticket mix, feedback and independent resolution/QA
          evidence before drawing conclusions.
        runbook_url: https://github.com/Bensonluo/rag_chatbot/blob/main/docs/operations/containment-alerts.md
  - eval_time: 31m
    alertname: ContainmentStatsUnavailable
    exp_alerts: []
  - eval_time: 31m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentRateLow
    exp_alerts:
    - *id003
  - eval_time: 60m
    alertname: ContainmentStatsUnavailable
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
