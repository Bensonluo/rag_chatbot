  - eval_time: 26m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 26m
    alertname: ContainmentStatsUnavailable
    exp_alerts: []
  - eval_time: 26m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
  - eval_time: 27m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 27m
    alertname: ContainmentStatsUnavailable
    exp_alerts:
    - *id001
  - eval_time: 27m
    alertname: ContainmentStatsClockSkew
    exp_alerts: []
  - eval_time: 60m
    alertname: ContainmentRateLow
    exp_alerts: []
  - eval_time: 60m
