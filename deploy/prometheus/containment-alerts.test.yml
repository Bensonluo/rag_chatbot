        description: Fresh nonempty snapshots report containment 0% for 30 minutes. This is
          the share of served sessions without a handoff ticket AND without an in-window downvote,
          not confirmed problem resolution. Only successfully scraped replicas with a successful
          refresh no more than 15 minutes old contribute to the mean. Empty, uninitialized,
          stale or invalid snapshots are excluded. A future-clock tolerance of 60 seconds
          avoids resetting pending alerts on small clock offsets; larger offsets are reported
          by ContainmentStatsClockSkew; ContainmentStatsUnavailable reports missing statistical
          evidence. Replicas can refresh at different instants; this is not an atomic database
          snapshot. Inspect ticket mix, feedback and independent resolution/QA evidence before
          drawing conclusions.
        runbook_url: https://github.com/Bensonluo/rag_chatbot/blob/main/docs/operations/containment-alerts.md
