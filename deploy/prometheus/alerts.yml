# Alert rules for the e-commerce CS bot (GB/T 47746—2026 时效 + TTFT SLOs).
#
# Thresholds are grounded in the observability iterations:
#   - handoff queue SLA: HANDOFF_SLA_WAIT_SECONDS (default 30s, HollyCRM
#     industry target; GB/T 47746 转人工时效 requirement)
#   - TTFT: industry conversational target <1s, drop-off rises ~7-10%
#     per extra waiting second
#   - claim-gate violations: policy drift / curated-fact staleness signal
#
# `for:` durations follow the flapping guidance (Prometheus alerting
# docs): 1m for page-worthy SLA breaches (a customer is waiting right
# now), 5m for rate/p95 conditions that need a stable window.

groups:
  - name: cs-handoff-sla
    rules:
      - alert: HandoffQueueSLABreach
        expr: avg(handoff_queue_sla_breaches) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "转人工排队违约 (GB/T 47746 时效)"
          description: >-
            {{ $value }} open handoff tickets have been waiting longer than
            the queue-wait SLA for over a minute — customers are holding
            while no agent picks up. Check agent staffing / claim rate.

      - alert: HandoffQueueOldestWaitCritical
        expr: avg(handoff_queue_oldest_wait_seconds) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "最老排队工单等待超过 60s（2× SLA 目标）"
          description: >-
            The oldest open handoff ticket has waited {{ $value }}s — twice
            the HollyCRM <30s industry target. Queue is draining too slowly.

  - name: cs-funnel
    rules:
      - alert: HandoffShareHigh
        expr: |
          (
            sum(rate(chat_funnel_layers_total{layer="handoff"}[15m]))
            /
            sum(rate(chat_funnel_layers_total[15m]))
          ) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "转人工层触达占比超过 25%"
          description: >-
            Handoff layer touches made up {{ $value | humanizePercentage }} of
            all funnel layer traffic over 15m. A sustained rise can indicate
            a traffic-mix or routing change; inspect customer requests
            and handoff outcomes. The 25% threshold is a starting point: tune it
            against the observed baseline once real traffic exists. Layer
            touches are counted per turn and are not mutually exclusive, so
            treat the ratio as a trend signal, not an exact session rate.
            Zero traffic yields NaN and simply does not fire.

  - name: cs-agent-loop
    rules:
      - alert: AgentFallbackShareHigh
        expr: |
          (
            sum(rate(agent_loop_outcomes_total{outcome="fallback"}[15m]))
            /
            sum(rate(agent_loop_outcomes_total[15m]))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent 回退占比超过 20%（深漏斗在静默降级）"
          description: >-
            {{ $value | humanizePercentage }} of agent-loop runs ended in
            fallback over 15m — the deepest funnel layer (task-intent
            users, the north star's real need) is being served by the
            deterministic slot pipeline instead of the tool loop. The
            fail-open fallback looks identical to healthy traffic from
            the outside, so this outcome mix is the only signal. Usual
            causes: provider lost function-calling support, or the
            loop is failing mid-run (see agent logs). The 20% threshold
            is a starting point — tune against the observed baseline
            once real traffic exists. Zero traffic yields NaN and
            simply does not fire.

  - name: cs-cache-pyramid
    rules:
      - alert: KBEpochFailuresRising
        expr: sum(increase(kb_epoch_failures_total[15m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "KB epoch 操作持续失败（缓存金字塔失效脊柱宕了）"
          description: >-
            {{ $value }} epoch read/bump failures in 15m. The epoch is the
            invalidation spine of the whole cache pyramid: sustained read
            failures silently disable every epoch-scoped layer (L0/L1/L2
            all refuse reads — the fail-open direction), and failed bumps
            serve stale answers until TTL. Neither is visible in request
            outcomes, so this counter is the only signal. A single
            transient Redis blip stays under the threshold; sustained
            degradation does not. Usual cause: Redis unreachable or
            overloaded — check the shared Redis first.

      - alert: EmbeddingCacheFailuresRising
        expr: sum(increase(embedding_cache_failures_total[15m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Embedding 缓存操作持续失败（金字塔地基静默失效）"
          description: >-
            {{ $value }} embedding cache read/write failures in 15m. L3 sits
            under every semantic operation — L1 semantic lookups embed the
            query first, so a dead L3 also craters L1's latency budget —
            and every RAG turn embeds too. Fail-open means every text
            silently re-embeds: the visible symptom is TTFT creep
            (ChatTTFTSlow) with no root-cause signal, because outcome
            metrics stay perfectly healthy. This counter is the only
            mechanism-level signal. A single failed batch stays under the
            threshold; a sustained outage at any real traffic does not.
            Usual cause: Redis unreachable or in an eviction storm — check
            Redis memory and connectivity.

  - name: cs-csat
    rules:
      - alert: FeedbackNegativeShareHigh
        expr: |
          (
            sum(rate(feedback_ratings_total{rating="-1"}[15m]))
            /
            sum(rate(feedback_ratings_total[15m]))
          ) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "用户差评率超过 25%（答案质量在劣化）"
          description: >-
            {{ $value | humanizePercentage }} of submitted ratings were
            thumbs-down over 15m. A downvote is the user-verified signal
            that an answer was not a resolution — the closest proxy to
            the containment north star. Sustained rise means
            answers are degrading (check RAG grounding, claim-gate
            violations, KB staleness) rather than traffic mix shifting.
            The 25% threshold is a starting point — tune against the
            observed baseline once real traffic exists. Zero traffic
            yields NaN and simply does not fire.

      # Default bridge interval is 300s. Allow three intervals of snapshot
      # age; keep these 900s bounds and the availability grace aligned with
      # CONTAINMENT_STATS_REFRESH_SECONDS if operators change the cadence.
      - alert: ContainmentRateLow
        expr: |
          avg by (job) (
            (chat_containment_rate{job="rag-chatbot-api"} >= 0)
            and (chat_containment_rate{job="rag-chatbot-api"} <= 1)
            and on (job, instance) (chat_sessions_served{job="rag-chatbot-api"} > 0)
            and on (job, instance) (chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"} > 0)
            and on (job, instance) (chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"} <= time() + 60)
            and on (job, instance) ((time() - chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"}) <= 900)
            and on (job, instance) (up{job="rag-chatbot-api"} == 1)
          ) < 0.7
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "会话级自动处理代理率低于 70%"
          description: >-
            Fresh nonempty snapshots report containment
            {{ $value | humanizePercentage }} for 30 minutes. This is the
            share of served sessions without a handoff ticket AND without
            an in-window downvote, not confirmed problem resolution.
            Only successfully scraped replicas with a successful refresh
            no more than 15 minutes old contribute to the mean. Empty,
            uninitialized, stale or invalid snapshots are excluded. A
            future-clock tolerance of 60 seconds avoids resetting pending
            alerts on small clock offsets; larger offsets are reported by
            ContainmentStatsClockSkew;
            ContainmentStatsUnavailable reports missing statistical evidence.
            Replicas can refresh at different instants; this is not an
            atomic database snapshot. Inspect ticket mix, feedback and
            independent resolution/QA evidence before drawing conclusions.
          runbook_url: "https://github.com/Bensonluo/rag_chatbot/blob/main/docs/operations/containment-alerts.md"

      - alert: ContainmentStatsUnavailable
        expr: |
          (
            count by (job) (
              up{job="rag-chatbot-api"}
              unless on (job, instance) (
                (up{job="rag-chatbot-api"} == 1)
                and on (job, instance) (chat_sessions_served{job="rag-chatbot-api"} >= 0)
                and on (job, instance) (chat_containment_rate{job="rag-chatbot-api"} >= 0)
                and on (job, instance) (chat_containment_rate{job="rag-chatbot-api"} <= 1)
                and on (job, instance) (chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"} > 0)
                and on (job, instance) (chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"} <= time() + 60)
                and on (job, instance) ((time() - chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"}) <= 900)
              )
            ) > 0
          )
          or absent(up{job="rag-chatbot-api"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "会话质量统计不可用或部分副本陈旧"
          description: >-
            At least one discovered API target has no valid containment
            snapshot, or no API targets are discovered, for 10 minutes.
            Check scrape health, successful-refresh timestamps, database
            access, refresher startup/configuration and clock alignment.
            Zero served sessions with a fresh successful snapshot is valid.
            A disabled refresher also leaves this KPI unavailable; this
            alert does not by itself prove a customer-facing outage or
            low containment. A healthy replica does not hide another
            replica's unavailable evidence.
          runbook_url: "https://github.com/Bensonluo/rag_chatbot/blob/main/docs/operations/containment-alerts.md"

      # A brief future timestamp after every refresh can otherwise reset
      # both pending timers indefinitely. Latch the observed clock error.
      - alert: ContainmentStatsClockSkew
        expr: |
          max by (job) (
            (chat_containment_stats_last_success_timestamp_seconds{job="rag-chatbot-api"} - time())
            and on (job, instance) (up{job="rag-chatbot-api"} == 1)
          ) > 60
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "会话统计成功时间超过允许的时钟偏差"
          description: >-
            A scraped API replica reports a successful-refresh timestamp
            more than 60 seconds ahead of Prometheus. Check application
            and Prometheus clock synchronization before trusting snapshot
            age. This warning fires immediately and stays active for
            10 minutes after its expression first stops matching, so brief
            repeated clock errors cannot silently reset the other pending timers.
            It does not by itself prove a customer-facing outage.
          runbook_url: "https://github.com/Bensonluo/rag_chatbot/blob/main/docs/operations/containment-alerts.md"

  - name: cs-chat-latency
    rules:
      - alert: ChatTTFTSlow
        expr: histogram_quantile(0.95, sum(rate(chat_first_token_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI 首字响应 p95 超过 1s（GB/T 47746 响应速度）"
          description: >-
            p95 time-to-first-token is {{ $value }}s over a stable 5m window
            (industry conversational target <1s; drop-off rises ~7-10% per
            extra waiting second). Check LLM provider latency / prefill load.

      - alert: ChatStreamErrorRateHigh
        expr: |
          (
            sum(rate(chat_stream_outcomes_total{outcome=~"graph_error|budget_exhausted"}[5m]))
            /
            sum(rate(chat_stream_outcomes_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "聊天流失败率超过 5%"
          description: >-
            {{ $value | humanizePercentage }} of chat streams ended in
            graph_error or budget_exhausted over 5m. Users are getting
            explicit failure frames instead of answers.

  - name: cs-policy-gate
    rules:
      - alert: ClaimGateViolationsRising
        expr: sum(increase(claim_violations_total[15m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "声明门控拦截率上升（策展事实可能过期）"
          description: >-
            The claim gate caught {{ $value }} policy-claim violations in
            15m. A rising catch rate usually means the curated fact table
            drifted from reality (policy change not yet ingested) — the LLM
            keeps asserting what the KG now contradicts.
