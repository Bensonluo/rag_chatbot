# CS API fan-out upstream — the node template's 2→N piece.
#
# docker-compose.yml binds the api service to 127.0.0.1:8000-8003 (one
# host port per replica), so `docker compose up --scale api=N` (N<=4)
# boots without port conflicts. This upstream fans host-nginx traffic
# out to every bindable port. Widen in LOCKSTEP: to scale beyond 4
# replicas, widen the compose range AND add servers here — the contract
# test in app/tests/unit/deploy/test_nginx_upstream.py fails the gate
# the moment the two sides drift.
#
# Rollout on the host (operator action, outside repo CI):
#   1. cp deploy/nginx/cs-upstream.conf /etc/nginx/conf.d/
#   2. In the public vhost, point the API location at the fan-out:
#         location / {
#             proxy_pass http://cs_api;
#         }
#   3. SSE (chat streaming) — carry in that same location, or tokens
#      arrive in visible bursts and slow LLM turns get cut off:
#         proxy_buffering off;
#         proxy_read_timeout 120s;
#   4. nginx -t && systemctl reload nginx

upstream cs_api {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
