services:
  # Server deployment unit for the standalone Agent Store page.
  # Built with BASE_PATH=/store so every asset and route lives under /store;
  # the host nginx routes benluo.art/store/ to 127.0.0.1:8090.
  store-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: /store
    image: agent-store-frontend:latest
    volumes:
      - ./nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    container_name: agent-store-frontend
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped
