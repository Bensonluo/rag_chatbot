server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static export with trailingSlash: "/foo/" serves foo/index.html.
    # Unknown paths are a hard 404 — never a 200 homepage soft-404 —
    # served with Next.js's generated not-found page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # trailingSlash:true emits the not-found page as 404/index.html;
    # the Dockerfile copies it to the root so this works with or
    # without a BASE_PATH mount.
    error_page 404 /404/index.html;

    # Same-origin API proxy: the chat calls relative /api/... so any
    # deployment (local compose or the author's server) works without
    # rebuilding the frontend with a baked-in API URL.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming chat
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Demo cover asset lives under /images/.
    location /images/ {
        try_files $uri =404;
    }
}
