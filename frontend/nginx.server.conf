# Server unit variant: the host nginx routes /store/ here AND handles /api/
# at the edge, so this config only serves the static export (no upstream).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static export with trailingSlash: "/foo/" serves foo.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
