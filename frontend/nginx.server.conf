# Server unit variant: the host nginx routes /store/ here AND handles /api/
# at the edge, so this config only serves the static export (no upstream).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static export with trailingSlash: "/foo/" serves foo/index.html.
    # Unknown paths are a hard 404 — never a 200 homepage soft-404 —
    # served with Next.js's generated not-found page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # trailingSlash:true emits the not-found page as 404/index.html;
    # the deployment that uses this config mounts the export at the
    # container root, so the page is already in place.
    error_page 404 /404/index.html;
}
