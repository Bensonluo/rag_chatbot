# Full-stack demo stack: Agent Store frontend + backend API + commerce
# provider + PostgreSQL/Redis/Qdrant, with an optional edge-nginx profile.
# One command for the complete product:
#   cp .env.example .env  (set GLM_API_KEY)
#   docker compose -f docker-compose.fullstack.yml up -d
# Frontend: http://localhost:3000  ·  API docs: http://localhost:8000/docs
services:
  # ==========================================
  # BACKEND API (FastAPI)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-chatbot:latest
    container_name: rag-chatbot-api
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-your_secure_password}@db:5432/rag_chatbot
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=20

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0

      # Vector DB
      - VECTOR_DB_URL=http://qdrant:6333
      - VECTOR_COLLECTION_NAME=documents

      # Commerce provider (the authoritative store)
      - COMMERCE_PROVIDER_MODE=external
      - COMMERCE_PROVIDER_URL=http://commerce-provider:8000
      - COMMERCE_PROVIDER_TOKEN=${COMMERCE_PROVIDER_TOKEN:-commerce-provider-dev-token}

      # LLM Configuration
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-5.3-flash}

      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}

      # Memory Configuration
      - MEMORY_TYPE=${MEMORY_TYPE:-optimized}
      - MEMORY_MAX_RECENT=${MEMORY_MAX_RECENT:-3}
      - MEMORY_MAX_RELEVANT=${MEMORY_MAX_RELEVANT:-5}
      - MEMORY_RELEVANCE_THRESHOLD=${MEMORY_RELEVANCE_THRESHOLD:-0.5}
      - MEMORY_TOKEN_BUDGET=${MEMORY_TOKEN_BUDGET:-4096}

      # Application Settings
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Service dependencies (for health checks)
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      commerce-provider:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: rag-chatbot-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-rag_chatbot}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=200
      -c work_mem=4MB
      -c maintenance_work_mem=64MB

  # ==========================================
  # REDIS CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: rag-chatbot-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-your_redis_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # QDRANT VECTOR DATABASE
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network


  # ==========================================
  # COMMERCE PROVIDER (authoritative virtual store)
  # ==========================================
  commerce-provider:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.commerce_provider"]
    environment:
      COMMERCE_PROVIDER_HOST: 0.0.0.0
      COMMERCE_PROVIDER_PORT: 8000
      COMMERCE_PROVIDER_DATABASE_PATH: /data/commerce.db
      COMMERCE_PROVIDER_AUTH_TOKEN: ${COMMERCE_PROVIDER_TOKEN:-commerce-provider-dev-token}
      COMMERCE_PROVIDER_FAULTS_ENABLED: "false"
    volumes:
      - commerce_provider_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-network
    restart: unless-stopped

  # ==========================================
  # AGENT STORE FRONTEND (standalone branding page)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agent-store-frontend:latest
    container_name: agent-store-frontend
    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      # nginx:alpine ships busybox wget (no curl); the root page must return 2xx
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # NGINX REVERSE PROXY (Optional)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: rag-chatbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - ./deployment/nginx/logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - rag-network
    profiles:
      - with-nginx  # Only start with: docker-compose --profile with-nginx up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  commerce_provider_data:
    driver: local

networks:
  rag-network:
    driver: bridge
