[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Architecture-focused GraphRAG chatbot demo with dialogue state and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Benson Luo"}]
license = {file = "LICENSE"}
keywords = ["rag", "chatbot", "llm", "fastapi", "memory", "intent-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pg8000>=1.30.0",
    "qdrant-client>=1.7.0",

    # Cache
    "redis>=5.0.1",
    "hiredis>=2.3.2",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0,<6.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",

    # HTTP Client
    "httpx>=0.26.0",

    # LLM Clients
    "openai>=1.10.0",
    "anthropic>=0.18.0",

    # Dialogue orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # Logging
    "structlog>=24.1.0",

    # Utilities
    "python-dotenv>=1.0.0",

    # Graph Database
    "neo4j>=5.26.0",

    # Embeddings & Reranking
    "sentence-transformers>=2.2.0",
    "pypdf>=4.0.0",

    # Optional GraphRAG demo algorithms used by the bundled community endpoint
    "networkx>=3.2.0",
    "python-louvain>=0.16",

    # Monitoring & Tracing
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.26.0",  # For testing FastAPI

    # Code Quality
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",

    # Type Stubs
    "types-redis>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/Bensonluo/rag_chatbot"
Documentation = "https://github.com/Bensonluo/rag_chatbot#readme"
Repository = "https://github.com/Bensonluo/rag_chatbot"
Issues = "https://github.com/Bensonluo/rag_chatbot/issues"

# Tool configurations

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "W191",   # indentation contains tabs
    "UP007",  # use X | Y for type annotation
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"app/tests/**/*.py" = ["ARG"]  # unused fixture arguments in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_defs = false

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "app/tests/unit/core/test_security.py",
    "app/tests/unit/services/dialogue",
    "app/tests/unit/services/intent",
    "app/tests/unit/services/slot_filling",
    "app/tests/unit/services/guardrails",
    "app/tests/unit/services/documents",
    "app/tests/unit/services/embeddings/test_factory.py",
    "app/tests/unit/services/retrieval",
    "app/tests/unit/services/graph",
    "app/tests/unit/api/v1/test_chat_initialization.py",
    "app/tests/unit/api/v1/test_document_initialization.py",
    "app/tests/unit/api/v1/test_runtime_health.py",
    "app/tests/unit/middleware/test_request_id.py",
    "app/tests/unit/services/llm/test_anthropic_client.py",
    "app/tests/unit/services/llm/test_openai_client.py",
    "app/tests/unit/services/test_auth_service.py",
    "app/tests/integration/api/test_auth_endpoints.py",
    "app/tests/integration/api/test_session_endpoints.py",
    "app/tests/unit/repositories",
]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = [
    "--import-mode=importlib",
    "--cov=app.core.security",
    "--cov=app.services.dialogue",
    "--cov=app.services.intent",
    "--cov=app.services.slot_filling",
    "--cov=app.services.guardrails",
    "--cov=app.services.documents",
    "--cov=app.services.retrieval",
    "--cov=app.services.graph",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--strict-markers",
    "--tb=short",
]

# Coverage configuration
[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    # Experimental/optional demo paths are kept in the repository but are not
    # part of the maintained core quality gate.
    "app/services/dialogue/graph.py",
    "app/services/dialogue/nodes.py",
    "app/services/dialogue/tools.py",
    "app/services/graph/community/*",
    "app/services/graph/extraction/entity_resolver.py",
    "app/services/graph/extraction/structured_importer.py",
    "app/services/graph/retrieval/graph_embedding_search.py",
    "app/services/graph/retrieval/text_to_cypher.py",
    "app/services/graph/schema.py",
    "app/services/slot_filling/factory.py",
]

[tool.coverage.report]
precision = 2
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
