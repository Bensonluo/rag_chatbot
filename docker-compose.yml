# Docker Compose for RAG Chatbot Development

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rag-chatbot-db
    environment:
      POSTGRES_DB: rag_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Redis (caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: rag-chatbot-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Cache + sliding-window state only (all keys TTL-bearing): an
    # explicit ceiling keeps growth from reaching the kernel OOM killer
    # on the shared 4GB box; allkeys-lru degrades to recomputation.
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: rag-chatbot-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - rag-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.26.0-community
    container_name: rag-chatbot-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rag-network

  # RAG Chatbot API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # No container_name: fixed names block `docker compose up --scale api=N`
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/rag_chatbot

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Qdrant
      VECTOR_DB_URL: http://qdrant:6333
      VECTOR_COLLECTION_NAME: documents

      # LLM API
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-glm-5.3-flash}

      # Embedding Models
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_CACHE_TTL: ${EMBEDDING_CACHE_TTL:-604800}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: neo4j
      GRAPH_RAG_ENABLED: ${GRAPH_RAG_ENABLED:-true}
      GRAPH_RAG_COMMUNITY_ENABLED: ${GRAPH_RAG_COMMUNITY_ENABLED:-true}

      # Security
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'

      # Logging
      LOG_LEVEL: INFO
    volumes:
      - ./app:/home/appuser/app/app
    ports:
      # Host port RANGE: Docker allocates one host port per replica, so
      # `docker compose up --scale api=N` (N<=4) boots without port
      # conflicts — the first replica keeps 8000 for the host nginx
      # upstream. Scale beyond 4: widen the range (and the nginx
      # upstream) — no re-architecture, just a wider window.
      - "127.0.0.1:8000-8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rag-network
    restart: unless-stopped

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: rag-chatbot-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rag-network
    profiles:
      - monitoring

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:10.2.2
    container_name: rag-chatbot-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - rag-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  rag-network:
    driver: bridge
